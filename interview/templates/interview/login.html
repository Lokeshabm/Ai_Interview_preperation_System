{% extends 'interview/base.html' %}

{% block title %}Student Login - AI Interview Prep{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="bg-dark text-white p-4 text-center">
                    <div class="avatar-circle bg-info text-dark mx-auto mb-3" style="width: 54px; height: 54px; font-size: 24px;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Student Login</h4>
                    <p class="text-secondary small mb-0">Sign in to your AI Interview Workspace</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next_url }}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="{% url 'register' %}" class="fw-semibold text-primary ms-1">Register now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
